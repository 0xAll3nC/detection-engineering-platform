name: Bug
description: Something in the platform code or tooling is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands and output. Redact credentials and lab details.
  - type: input
    id: version
    attributes:
      label: Commit / version
