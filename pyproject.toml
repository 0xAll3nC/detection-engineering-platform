[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "detection-platform"
version = "0.1.0"
description = "Detection-as-code with live adversary-emulation validation against Wazuh raw telemetry."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Allen Clement J" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Private :: Do Not Upload",
]
# pySigma is pinned to the minor versions validated live (2026-10-11).
# Its API has broken compatibility before (SigmaCollection.from_files);
# upgrades go through a PR so compiled-query snapshot diffs get reviewed.
dependencies = [
    "pysigma>=1.5.1,<1.6",
    "pysigma-backend-opensearch>=2.0.3,<2.1",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# Only needed to drive the Windows victim (adversary emulation).
lab = ["pywinrm>=0.5"]

[project.scripts]
detplat = "detection_platform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "pre-commit>=4.0",
    "pip-audit>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/detection_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "network: needs internet access (e.g. MITRE ATT&CK data download)",
]

[tool.coverage.run]
source = ["detection_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
