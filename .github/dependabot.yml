version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      # CodeQL's init and analyze steps must run the same action version: a
      # mismatch fails the workflow ("Loaded a configuration file for version X,
      # but running version Y"). Dependabot treats them as separate
      # dependencies, so without this group it opens one unmergeable PR per
      # step (seen in #16 / #18). No update-types filter: majors are grouped too.
      codeql-action:
        patterns:
          - "github/codeql-action*"
