# How each detection is validated live, keyed by Sigma rule id.
#
# mechanism: how the behaviour is produced. Currently only `atomic`
#   (Invoke-AtomicRedTeam). The schema allows other mechanisms later
#   (e.g. manual, replay, custom script) - see ADR-0006.
# technique: the ATT&CK technique the selected behaviour is mapped to.
# atomic.guid: auto_generated_guid of the Atomic test. Required before a rule
#   can be promoted beyond `experimental` when mechanism == atomic
#   (enforced by tests/detections/test_detection_quality.py).
# atomic.test_numbers: legacy selector carried over from the original
#   technique map. Test numbering changes between atomic-red-team releases;
#   numbers below are UNVERIFIED and several are believed to select the wrong
#   test (issue #4). The orchestrator refuses unverified mappings
#   unless --allow-unverified is passed.
# verified: true only after the selected test has been reviewed against the
#   pinned atomics checkout and confirmed to produce the detected behaviour.

schema_version: 1

