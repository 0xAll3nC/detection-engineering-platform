title: LSASS Memory Dump via comsvcs.dll MiniDump
id: f39c9d2f-5a30-4f95-8cd2-6c03a1329ee5
status: experimental
description: |
    Detects use of rundll32.exe with comsvcs.dll's MiniDump export to dump
    LSASS process memory, a common credential-theft technique that avoids
    dropping known dumping tools like procdump.exe to disk.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Allen Clement J
date: 2026-09-19
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\rundll32.exe'
    selection_export:
        CommandLine|contains: 'comsvcs.dll'
    selection_action:
        CommandLine|contains: 'MiniDump'
    condition: all of selection_*
falsepositives:
    - Unlikely. comsvcs.dll MiniDump invocation via rundll32 has no common
      legitimate administrative use.
level: high
tags:
    - attack.credential-access
    - attack.t1003.001
