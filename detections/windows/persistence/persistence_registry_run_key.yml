title: Registry Run Key Persistence
id: 1076ece8-1900-4a0a-862d-f5248381bda9
status: experimental
description: |
    Detects creation or modification of a value under the classic Run /
    RunOnce registry autostart keys, a widely used persistence mechanism
    that launches a program every time a user logs on.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Allen Clement J
date: 2026-09-19
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        EventType: 'SetValue'
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
    filter_known_software:
        Details|contains:
            - 'OneDriveSetup.exe'
            - 'SecurityHealth'
    condition: selection and not filter_known_software
falsepositives:
    - Legitimate software installers registering an autostart entry.
      Tune the filter_known_software list to your environment's baseline.
level: medium
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.001
